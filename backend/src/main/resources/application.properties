
# Base de datos PostgreSQL local (instalación de desarrollo: usuario postgres / clave postgres).
# En otro equipo o servidor, sobrescribe con las variables DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tracking_logistico}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


server.port=${PORT:8080}

# JWT: en cualquier entorno compartido define JWT_SECRET (mínimo 32 caracteres).
# El token solo identifica una sesión del servidor; la sesión se cierra por inactividad
# (app.session.inactivity-minutes) o al cerrar sesión. Esta expiración es un tope absoluto.
jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-que-debe-tener-al-menos-256-bits-ok}
jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# HU-S-22: minutos sin interacción tras los que el servidor invalida la sesión.
app.session.inactivity-minutes=${SESSION_INACTIVITY_MINUTES:5}

# Administrador fijo: DataInitializer lo crea o lo restablece (rol, clave, desbloqueo) en cada arranque.
app.admin.email=${ADMIN_EMAIL:admin@tracking.com}
app.admin.password=${ADMIN_PASSWORD:admin1234}

# HU-S-23: dirección del frontend que se usa en el enlace de verificación del correo.
app.frontend-url=${FRONTEND_URL:http://localhost:8443}

# Correo (HU-S-23). Sin SPRING_MAIL_HOST no se envían correos: el enlace se escribe en el log
# y se devuelve a la interfaz ("modo desarrollo"). Para enviarlos de verdad define las variables
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD
# (p. ej. smtp.gmail.com, 587 y una contraseña de aplicación). spring.mail.host no se declara
# aquí a propósito: con solo existir, aunque esté vacío, Spring crearía un cliente SMTP sin servidor.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@trackline.local}

# HU-18 y HU-S-19: canales de contacto definidos por la empresa. Vacíos = no configurados
# (la interfaz lo indica en vez de mostrar un número inventado).
# WHATSAPP_NUMBER en formato internacional sin "+" ni espacios, p. ej. 573001234567.
app.contact.whatsapp=${WHATSAPP_NUMBER:}
app.contact.support-phone=${SUPPORT_PHONE:}
app.contact.hours=${SUPPORT_HOURS:Lunes a viernes, 8:00 a. m. a 6:00 p. m.}

# HU-15 (regla propuesta, pendiente de validar con el cliente): horas máximas desde
# "Recibido en origen" antes de considerar retrasado un envío no entregado.
app.delays.max-hours.pequeno=72
app.delays.max-hours.mediano=72
app.delays.max-hours.grande=96
app.delays.max-hours.extragrande=120

# Datos de ejemplo (usuarios y envíos con historial). Solo para desarrollo y demostraciones.
app.demo-data.enabled=${DEMO_DATA:false}

# Orígenes permitidos para CORS (en producción se define con la variable CORS_ORIGINS)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

